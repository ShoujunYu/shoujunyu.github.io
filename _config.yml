# Minimal Jekyll configuration. No theme or Academic Pages dependency.
title: "Shoujun Yu (余守骏)"
description: "Academic homepage of Shoujun Yu"
url: "https://shoujunyu.github.io"
baseurl: ""
markdown: kramdown
collections:
  publications:
    output: true
    permalink: /publication/:name/
defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
exclude:
  - README.md
  - MIGRATION.md
  - .gitignore
